name: Daily Autonomous Web Curation & Auto-Ingestion

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-curation-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Autonomous Web Discovery & Curation Engine
        run: |
          node scripts/curator.js

      - name: Commit and Push Newly Ingested Vault Books
        run: |
          git config --global user.name "Reading Vault Bot"
          git config --global user.email "bot@readingvault.local"
          git add books.json
          git commit -m "🤖 Autonomous Web Curation: Discovered and added new articles across all categories [skip ci]" || echo "No changes to commit"
          git push origin main || git push origin master || echo "Push complete"
