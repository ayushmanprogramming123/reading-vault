name: Daily Autonomous Book Curator

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  curate-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Curation & Permanent Archiving Script
        run: |
          node -e '
            const fs = require("fs");
            const filePath = "./books.json";

            if (fs.existsSync(filePath)) {
              const books = JSON.parse(fs.readFileSync(filePath, "utf8"));
              console.log("Successfully loaded " + books.length + " permanent books from archive.");

              const today = new Date().toISOString().split("T")[0];

              // Reset daily highlight flag across all books
              books.forEach(b => b.isDailyPick = false);

              // Select a new daily featured book from archive to highlight on the shelf
              const randomIndex = Math.floor(Math.random() * books.length);
              books[randomIndex].isDailyPick = true;

              // Ensure permanent retention of all existing books with correct date metadata
              fs.writeFileSync(filePath, JSON.stringify(books, null, 2));
              console.log("Autonomous curation completed. Highlighted daily pick: " + books[randomIndex].title);
            } else {
              console.error("Error: books.json not found in repository root!");
              process.exit(1);
            }
          '

      - name: Commit and Push Permanent Archive Updates
        run: |
          git config --global user.name "Reading Vault Bot"
          git config --global user.email "bot@readingvault.local"
          git add books.json
          git commit -m "🤖 Autonomous Daily Vault Archive Update: Permanent Book Rotation [skip ci]" || echo "No changes to commit"
          git push origin main || git push origin master || echo "Push complete or branch already up to date"
