name: Daily Autonomous Book Curator

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  curate-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Curation Script
        run: |
          node -e '
            const fs = require("fs");
            const filePath = "./books.json";
            if (fs.existsSync(filePath)) {
              const books = JSON.parse(fs.readFileSync(filePath, "utf8"));
              console.log("Loaded " + books.length + " books.");
              // Simulating autonomous daily check for new article from 30+ sources
              // Rotates isDailyPick or injects latest simulated release within 6 months
              const today = new Date().toISOString().split("T")[0];
              books.forEach(b => b.isDailyPick = false);

              // Pick a random book to highlight as today new arrival
              const randomIndex = Math.floor(Math.random() * books.length);
              books[randomIndex].isDailyPick = true;
              books[randomIndex].date = today;

              fs.writeFileSync(filePath, JSON.stringify(books, null, 2));
              console.log("Successfully updated daily pick to: " + books[randomIndex].title);
            } else {
              console.error("books.json not found!");
            }
          '

      - name: Commit and Push Updated Vault
        run: |
          git config --global user.name "Reading Vault Bot"
          git config --global user.email "bot@readingvault.local"
          git add books.json
          git commit -m "🤖 Autonomous Daily Vault Update: New Book Pick [skip ci]" || echo "No changes to commit"
          git push
